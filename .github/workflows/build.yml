name: Build SFA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. 获取 SFA 官方源码
      - name: Checkout SFA source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: dev
          path: sing-box-for-android

      # 2. 获取 sing-box 官方核心源码
      - name: Checkout sing-box core
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.15.0-alpha.13
          path: sing-box

      # 3. 安装 Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. 安装 Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      # 5. 配置 Android SDK 环境
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      # 6. 安装 Android SDK 和 NDK
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      # 7. 安装 gomobile
      - name: Install gomobile
        working-directory: sing-box
        run: |
          make lib_install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # 8. 编译 sing-box Android 核心库
      - name: Build libbox Android libraries
        working-directory: sing-box
        run: |
          make lib_android

      # 9. 编译 SFA APK
      - name: Build SFA APK
        working-directory: sing-box-for-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleOtherDebug

      # 10. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFA-Android-APK
          path: sing-box-for-android/app/build/outputs/apk/other/debug/*.apk
          if-no-files-found: error
          retention-days: 7
