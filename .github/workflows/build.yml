
name: Build SFA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout SFA source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: dev
          path: sing-box-for-android

      - name: Checkout sing-box core
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.15.0-alpha.13
          path: sing-box

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Install gomobile
        working-directory: sing-box
        run: |
          make lib_install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build libbox Android libraries
        working-directory: sing-box
        run: |
          make lib_android

      - name: Build SFA APK
        working-directory: sing-box-for-android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFA-Android-APK
          path: sing-box-for-android/app/build/outputs/apk/other/debug/*.apk
          if-no-files-found: error
          retention-days: 7
